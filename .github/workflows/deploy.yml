name: NoEscape Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            no-escape-back/package-lock.json
            NoEscape-UI/package-lock.json

      # The runner workspace and ~/dev/noescape are not the same directory.
      # PM2 serves the live tree, so the build has to happen there.
      # .env is gitignored and stays on the server. .env.example is local Docker only.
      - name: Update the live checkout
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Refuse a local database URL
        run: |
          set -euo pipefail
          db_url=$(grep -E '^DATABASE_URL=' "$HOME/dev/noescape/no-escape-back/.env" || true)
          case "$db_url" in
            *127.0.0.1*|*localhost*|*file:*)
              echo "Refusing to deploy: DATABASE_URL points at a local database."
              exit 1
              ;;
            "")
              echo "Refusing to deploy: DATABASE_URL is missing from the server .env."
              exit 1
              ;;
          esac

      - name: Backend — install, push schema, build
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape/no-escape-back"
          npm ci
          npx prisma generate
          npx prisma db push
          npm run build

      - name: Frontend — install and build
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape/NoEscape-UI"
          npm ci
          npx ng build --configuration production

      - name: Restart PM2 from the live tree
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape"
          pm2 delete noescape >/dev/null 2>&1 || true
          pm2 start ecosystem.config.json
          pm2 save
