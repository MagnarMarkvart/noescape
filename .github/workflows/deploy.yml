name: NoEscape Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            no-escape-back/package-lock.json
            NoEscape-UI/package-lock.json

      # The runner workspace and ~/dev/noescape are not the same directory.
      # PM2 serves the live tree, so the build has to happen there.
      # .env is gitignored and stays on the server. .env.example is local Docker only.
      - name: Update the live checkout
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Refuse a local database URL
        run: |
          set -euo pipefail
          db_url=$(grep -E '^DATABASE_URL=' "$HOME/dev/noescape/no-escape-back/.env" || true)
          case "$db_url" in
            *127.0.0.1*|*localhost*|*file:*)
              echo "Refusing to deploy: DATABASE_URL points at a local database."
              exit 1
              ;;
            "")
              echo "Refusing to deploy: DATABASE_URL is missing from the server .env."
              exit 1
              ;;
          esac

      - name: Backend — install, push schema, build
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape/no-escape-back"
          npm ci
          npx prisma generate
          # Prisma loads .env itself. Override with a rewritten URL so db push
          # uses session port 5432 even if the server file still says 6543.
          # The file is deleted before the step ends and is never printed.
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('.env', 'utf8');
          function val(key) {
            const line = text.split(/\r?\n/).find((l) => l.startsWith(key + '='));
            if (!line) return '';
            let v = line.slice(key.length + 1).trim();
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
              v = v.slice(1, -1);
            }
            return v;
          }
          function fix(u) {
            if (!u) return '';
            let n = u.replace(/:6543(?=\/|\?|$)/, ':5432');
            if (!/[?&]connection_limit=/.test(n)) {
              n += (n.includes('?') ? '&' : '?') + 'connection_limit=2&pool_timeout=20';
            }
            return n;
          }
          function sh(v) {
            return "'" + v.replace(/'/g, "'\\''") + "'";
          }
          const db = fix(val('DATABASE_URL'));
          const direct = fix(val('DIRECT_URL') || val('DATABASE_URL'));
          fs.writeFileSync('.pg-runtime.env', `DATABASE_URL=${sh(db)}\nDIRECT_URL=${sh(direct)}\n`, { mode: 0o600 });
          NODE
          set -a
          # shellcheck disable=SC1091
          . ./.pg-runtime.env
          set +a
          rm -f .pg-runtime.env
          # Run pre-push migration for Lists titleNormalized column
          npx prisma db execute --schema prisma/schema.prisma --file scripts/pre-push-lists-title-normalized.sql
          npx prisma db push
          npx prisma db execute --schema prisma/schema.prisma --file scripts/repair-id-sequences.sql
          npm run build

      - name: Frontend — install and build
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape/NoEscape-UI"
          npm ci
          npx ng build --configuration production

      - name: Restart PM2 from the live tree
        run: |
          set -euo pipefail
          cd "$HOME/dev/noescape"
          pm2 delete noescape >/dev/null 2>&1 || true
          pm2 start ecosystem.config.json
          pm2 save
