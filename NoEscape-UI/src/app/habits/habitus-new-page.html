<app-forge-shell
  kicker="Habitus"
  title="New habit"
  lede="Configure cadence and icon. Logs stay in Progression forever."
  backHref="/habitus"
  backLabel="Back to Habitus"
  [toast]="toast()"
>
  <form class="create" (submit)="$event.preventDefault(); create()">
    <fieldset>
      <legend>Name</legend>
      <input type="text" [formField]="createForm.name" />
    </fieldset>

    <app-icon-picker
      [selected]="createModel().icon"
      (picked)="pickIcon($event)"
    />

    <fieldset>
      <legend>Cadence</legend>
      <select [formField]="createForm.cadence">
        <option value="DAILY">Daily</option>
        <option value="EVERY_N_DAYS">Every N days</option>
      </select>
    </fieldset>
    <fieldset>
      <legend>Every N days</legend>
      <app-number-field
        ariaLabel="Every N days"
        [min]="1"
        [max]="365"
        [value]="createModel().everyNDays"
        (valueChange)="setEveryNDays($event)"
      />
    </fieldset>

    <fieldset>
      <legend>Skill (optional)</legend>
      <app-skill-tree-picker
        [categories]="categories()"
        [skills]="subskills()"
        [selectedCategory]="selectedCategory()"
        [selectedSlugs]="selectedSlugs()"
        (categoryChange)="selectCategory($event)"
        (skillPick)="pickSkill($event)"
      />
    </fieldset>

    @if (showWealth()) {
      <fieldset>
        <legend>Wealth gained ({{ currencyLabel() }})</legend>
        <input
          type="text"
          inputmode="decimal"
          [value]="createModel().wealthAmount"
          (input)="setWealthAmount($event)"
          placeholder="0.00"
        />
      </fieldset>
    }

    <div class="actions">
      <button type="submit" [disabled]="creating()">
        {{ creating() ? '…' : 'Create habit' }}
      </button>
      <a routerLink="/habitus">Cancel</a>
    </div>
  </form>
</app-forge-shell>
