<app-history-log
  kicker="Archive"
  title="Horo Log"
  [lede]="lede()"
  backHref="/horologium"
  backLabel="Back to Horologium"
  [date]="selectedDate()"
  [today]="todayIso()"
  [marks]="calendarMarks()"
  [loading]="loading()"
  [empty]="!loading() && items().length === 0"
  emptyText="No sessions on this day."
  (dateChange)="onDateNav($event)"
  (rangeChange)="loadCalendar($event)"
>
  <ul class="session-log">
    @for (row of items(); track (row.kind || 'session') + ':' + row.id) {
      <li>
        <button
          type="button"
          class="session-card"
          (click)="open(row)"
          [attr.aria-pressed]="
            selected()?.id === row.id &&
            (selected()?.kind || 'session') === (row.kind || 'session')
          "
        >
          <div class="log-top">
            <strong>{{ clock(startIso(row)) }} – {{ clock(row.completedAt) }}</strong>
            <span class="xp-chip" [class.loss]="row.xpAwarded < 0">
              {{ row.xpAwarded >= 0 ? '+' : '−' }}{{ (row.xpAwarded < 0 ? -row.xpAwarded : row.xpAwarded) | number }} XP
            </span>
          </div>
          @if (row.kind === 'consuetudo') {
            <p class="log-meta">
              <span aria-hidden="true">{{ row.routineIcon || '◆' }}</span>
              Consuetudo · {{ row.routineName || row.taskLabel || 'Practice' }}
            </p>
          } @else {
            @if (row.endedEarly) {
              <p class="early-tag">Ended early · task done{{ row.elapsedMinutes != null ? ' · ' + row.elapsedMinutes + 'm elapsed' : '' }}</p>
            }
            <p class="log-meta">
              <span aria-hidden="true">{{ row.skill?.icon || '🧠' }}</span>
              {{ row.note || (row.iterations + '×' + row.workMinutes + 'm') }}
            </p>
          }
        </button>
      </li>
    }
  </ul>
</app-history-log>

@if (selected(); as row) {
  <app-horologium-session-sheet [session]="row" (closed)="close()" />
}
